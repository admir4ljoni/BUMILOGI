name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: web/package.json }
      - run: bun install --frozen-lockfile && bun test && bun run lint && bun run build
        working-directory: web
