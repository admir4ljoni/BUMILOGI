name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # The build prerenders public pages from the database, so CI needs one.
      db:
        image: postgres:16-alpine
        env: { POSTGRES_USER: bumilogi, POSTGRES_PASSWORD: dev, POSTGRES_DB: bumilogi }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgres://bumilogi:dev@localhost:5432/bumilogi
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: web/package.json }
      - run: bun install --frozen-lockfile && bun test && bun run lint && bun run db:migrate && bun run db:seed && bun run build
        working-directory: web
